---
# markdownlint-cli2 configuration

config:
  extends: .markdownlint.yaml

# Glob patterns to ignore (gitignore-style)
ignores:
  # Build artifacts and caches
  - node_modules/**
  - .cache/**

  # Vendored dependencies
  - .terraform/**
  - "**/.terraform/**"
  - "**/.ansible/**"
  - .opencode/**

  # Dormant trees (tmp/ mirrors in-tree locations; restored at phase
  # activation, linters re-adjusted then)
  # TODO: remove when tmp/ docs are restored to docs/
  - tmp/**
