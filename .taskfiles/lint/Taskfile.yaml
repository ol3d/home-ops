---
version: "3"

vars:
  LINTER_CONFIG_DIR: "{{.ROOT_DIR}}/.github/linters"
  TERRAFORM_DIR: "{{.ROOT_DIR}}/lab/provision/terraform"

tasks:
  check:
    desc: "Run all linting checks (pre-commit, ansible-lint, tflint, packer fmt)"
    cmds:
      - pre-commit run --all-files
      - cmd: ANSIBLE_ROLES_PATH={{.ROOT_DIR}}/lab/provision/ansible/.ansible/roles ansible-lint -c {{.LINTER_CONFIG_DIR}}/.ansible-lint
        dir: "{{.ROOT_DIR}}/lab/provision/ansible"
      - terraform fmt -check -recursive {{.TERRAFORM_DIR}}
      - |
        cd {{.TERRAFORM_DIR}}
        for module in modules/aws modules/backblaze modules/cloudflare modules/github modules/proxmox state-backend; do
          echo "tflint: $module"
          (cd "$module" && tflint --init --config {{.LINTER_CONFIG_DIR}}/.tflint.hcl >/dev/null && tflint --config {{.LINTER_CONFIG_DIR}}/.tflint.hcl)
        done
      - packer fmt -check -recursive {{.ROOT_DIR}}/lab/provision/packer

  fix:
    desc: "Auto-fix formatting across the whole tree (via pre-commit fixer hooks)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - pre-commit run --all-files
